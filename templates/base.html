<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CodeZone</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

  <!-- Header com logo + nav -->
  <header class="bg-light py-3 border-bottom">
    <div class="container d-flex justify-content-between align-items-center">
      <a href="/" class="d-flex align-items-center text-decoration-none">
        <img src="{{ url_for('static', filename='images/logo-codezone.png') }}" alt="CodeZone Logo" width="50" class="me-2">
        <span class="fw-bold text-dark">CodeZone</span>
      </a>
      <nav>
        <ul class="nav">
          <li class="nav-item"><a class="nav-link" href="/">Início</a></li>
          <li class="nav-item"><a class="nav-link" href="/trilhas">Trilhas</a></li>
          <li class="nav-item"><a class="nav-link" href="/blog">Curiosidades</a></li>
          <li class="nav-item"><a class="nav-link" href="/sobre">Sobre</a></li>
          <li class="nav-item"><a class="nav-link" href="/contato">Contato</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <!-- Conteúdo principal -->
  <main>
    {% block content %}{% endblock %}
  </main>
